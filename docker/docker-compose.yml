services:
  database:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: local-freepbx-root
      MARIADB_DATABASE: asterisk
      MARIADB_USER: asterisk
      MARIADB_PASSWORD: local-freepbx
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-plocal-freepbx-root"]
      interval: 5s
      timeout: 3s
      retries: 30

  pbx:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      FREEPBX_DB_HOST: database
      FREEPBX_DB_USER: asterisk
      FREEPBX_DB_PASSWORD: local-freepbx
      FREEPBX_DB_NAME: asterisk
      FREEPBX_CDR_DB_NAME: asteriskcdrdb
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ../:/srv/pendingchanges:ro
      # Keep FreePBX's installed framework/modules across ordinary container
      # recreation; `docker compose down -v` remains the explicit lab reset.
      - freepbx-web:/var/www/html
      - asterisk-config:/etc/asterisk
      - asterisk-var:/var/lib/asterisk
      - watcher-data:/var/lib/asterisk/pendingchanges-watcher:ro
      - attribution-data:/var/lib/asterisk/pendingchanges-attribution
    healthcheck:
      test: ["CMD-SHELL", "test -f /etc/freepbx.conf && php /var/lib/asterisk/bin/fwconsole --version >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  custom-watcher:
    build: ./custom-watcher
    depends_on:
      pbx:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_USER: asterisk
      DB_PASSWORD: local-freepbx
      DB_NAME: asterisk
      WATCH_PATH: /etc/asterisk
      MODULE_PATH: /var/www/html/admin/modules
      # Immediate FreePBX state is scoped to these named AstDB families; this
      # deliberately excludes arbitrary application and runtime keys.
      ASTDB_PATH: /var/lib/asterisk/astdb.sqlite3
      ASTDB_FAMILIES: "AMPUSER,DEVICE,CF,CFB,CFU,CFNA,DND,CW,FOLLOWME,BLKVM"
      ASTDB_MAX_ROWS: "10000"
      # Safety boundary: only named configuration tables are eligible and no
      # table above this size is read into a baseline.
      # The final entry is a disposable smoke-only fixture, not a production
      # table name.
      WATCH_TABLES: "announcement,callbacks,conferences,customappsreg,devices,did,extension_routes,extensions,fax_details,featurecodes,freepbx_settings,globals,iax,injected,ivr_details,ivr_entries,miscapps,miscdests,modules,outbound_route_patterns,outbound_route_sequence,outbound_route_sequences,outbound_route_trunks,outbound_routes,parkinglot,pjsip,queues_config,queues_details,queues_members,ringgroups,sip,sipsettings,kvstore_Sipsettings,timeconditions,timegroups,timegroups_details,trunk_dialpatterns,trunks,userman_users,userman_users_settings,users,zap,pc_smoke_fixture"
      MAX_TABLE_ROWS: "5000"
      # `sip` is endpoint configuration, not call history.  Preserve its
      # readable settings in the private baseline; public output redacts
      # sensitive fields.
      TABLE_ROW_LIMITS: "sip=20000"
      ATTRIBUTION_LOG: /var/lib/asterisk/pendingchanges-attribution/requests.jsonl
      # Poll only the tiny reload flag and attribution-file timestamp every
      # five seconds. The bounded full snapshot runs on a transition/event or
      # at most every 30 seconds while the PBX is otherwise idle.
      PROBE_INTERVAL: "5"
      FULL_SCAN_INTERVAL: "30"
      # Keep the lab gate reasonably short. Production defaults to five
      # minutes, with authenticated Module Admin activity triggering it early.
      MODULE_SCAN_INTERVAL: "30"
    volumes:
      - asterisk-config:/etc/asterisk:ro
      - asterisk-var:/var/lib/asterisk:ro
      - freepbx-web:/var/www/html:ro
      - watcher-data:/var/lib/pendingchanges-watcher
      - attribution-data:/var/lib/asterisk/pendingchanges-attribution:ro
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/pendingchanges-watcher/status.json"]
      interval: 5s
      timeout: 3s
      retries: 30

  smoke:
    build: ./smoke
    profiles: ["smoke"]
    depends_on:
      custom-watcher:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_USER: asterisk
      DB_PASSWORD: local-freepbx
      DB_NAME: asterisk
    volumes:
      - ../:/srv/pendingchanges:ro
      - asterisk-config:/etc/asterisk
      - freepbx-web:/var/www/html
      - watcher-data:/var/lib/pendingchanges-watcher

volumes:
  mariadb-data:
  freepbx-web:
  asterisk-config:
  asterisk-var:
  watcher-data:
  attribution-data:
