server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.php index.html;
    client_max_body_size 100m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        # Debian's generic fastcgi_params deliberately normalizes HTTP_HOST to
        # $host, which drops Docker's external high port. FreePBX compares the
        # authenticated AJAX referrer with HTTP_HOST and rejects that mismatch.
        # This lab listens only on loopback, so preserve the original Host and
        # the bounded browser headers FreePBX consumes.
        fastcgi_param HTTP_HOST $http_host;
        # FreePBX's ordinary config.php action guard compares the referrer's
        # hostname with SERVER_NAME (separately from the AJAX HTTP_HOST check).
        # A catch-all nginx server otherwise exposes SERVER_NAME as "_".
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTP_REFERER $http_referer;
        fastcgi_param HTTP_COOKIE $http_cookie;
        fastcgi_param HTTP_USER_AGENT $http_user_agent;
        fastcgi_param HTTP_ACCEPT $http_accept;
        fastcgi_param HTTP_X_REQUESTED_WITH $http_x_requested_with;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 300;
    }

    location ~ /\. {
        deny all;
    }
}
