name: Bug report
description: Report a reproducible problem without PBX secrets or customer data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste credentials, database dumps, configuration archives, call records, session data, or unredacted production screenshots.
  - type: input
    id: module
    attributes:
      label: Pending Changes module version
      placeholder: 17.0.0.12
    validations:
      required: true
  - type: input
    id: watcher
    attributes:
      label: Watcher version
      placeholder: 0.1.2
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: FreePBX, Framework, PHP, Asterisk, and operating-system versions
    validations:
      required: true
  - type: dropdown
    id: health
    attributes:
      label: Watcher health shown on the Reports page
      options: [Healthy, Delayed, Stale, Invalid, Unreadable, Installed Unconfigured, Not Installed]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Synthetic reproduction steps
      description: Use test-only identifiers and say whether Apply Config was pressed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, customer data, call records, session data, and production configuration values.
          required: true
